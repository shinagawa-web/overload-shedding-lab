name: exp01 — Event Loop Starvation

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Load concurrency"
        default: "10"
      duration:
        description: "Measure duration (s)"
        default: "30"
      warmup:
        description: "Warmup duration (s)"
        default: "10"
      shed_thresholds:
        description: "Shedding thresholds to test (comma-separated ms)"
        default: "50,100,150"
  pull_request:
    paths:
      - "experiments/01-eventloop/**"
      - "app/**"
      - "loadgen/**"
      - "analyze/**"

jobs:
  baseline:
    name: "No shedding"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm install && cd app && npm install
      - name: Start app
        run: |
          docker compose --profile base up -d --build
          sleep 5
      - name: Run load
        env:
          APP_URL: http://localhost:3000
          CONCURRENCY: ${{ inputs.concurrency || '10' }}
          DURATION: ${{ inputs.duration || '30' }}
          WARMUP: ${{ inputs.warmup || '10' }}
          CSV_OUT: results-baseline.csv
        run: node loadgen/ramp.js exp01
      - name: Plot
        run: node analyze/plot.js results-baseline.csv >> $GITHUB_STEP_SUMMARY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp01-baseline
          path: results-baseline.csv
      - name: Stop app
        if: always()
        run: docker compose --profile base down

  with-shedding:
    name: "Shedding threshold=${{ matrix.threshold }}ms"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        threshold: ${{ fromJson(format('[{0}]', inputs.shed_thresholds || '50,100,150')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm install && cd app && npm install
      - name: Start app with shedding
        run: |
          SHED_THRESHOLD_MS=${{ matrix.threshold }} docker compose --profile base up -d --build
          sleep 5
      - name: Run load
        env:
          APP_URL: http://localhost:3000
          CONCURRENCY: ${{ inputs.concurrency || '10' }}
          DURATION: ${{ inputs.duration || '30' }}
          WARMUP: ${{ inputs.warmup || '10' }}
          CSV_OUT: results-shed-${{ matrix.threshold }}ms.csv
        run: node loadgen/ramp.js exp01
      - name: Plot
        run: |
          echo "## Shedding threshold: ${{ matrix.threshold }}ms" >> $GITHUB_STEP_SUMMARY
          node analyze/plot.js results-shed-${{ matrix.threshold }}ms.csv >> $GITHUB_STEP_SUMMARY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp01-shed-${{ matrix.threshold }}ms
          path: results-shed-${{ matrix.threshold }}ms.csv
      - name: Stop app
        if: always()
        run: docker compose --profile base down
