name: exp02 — Go Queue Experiment

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Load concurrency"
        default: "50"
      duration:
        description: "Measure duration (s)"
        default: "30"
      warmup:
        description: "Warmup duration (s)"
        default: "10"
  pull_request:
    paths:
      - "experiments/go-queue/**"
      - "loadgen/ramp-go.js"
      - "loadgen/scenarios/go01.js"

jobs:
  arm-a:
    name: "Arm A — unlimited goroutines"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install deps
        run: npm install
      - name: Start go-app
        run: |
          ARM=a docker compose --profile go-queue up -d --build
          sleep 5
      - name: Run load
        env:
          APP_URL: http://localhost:3000
          CONCURRENCY: ${{ inputs.concurrency || '50' }}
          DURATION: ${{ inputs.duration || '30' }}
          WARMUP: ${{ inputs.warmup || '10' }}
          ARM: a
          CSV_OUT: results-go-arm-a.csv
        run: node loadgen/ramp-go.js
      - name: Summarize
        run: |
          echo '## Arm A — unlimited goroutines (math loop burnCPU)' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '| sync_ms | endpoint | p50 | p99 | goroutines_peak | mem_mb |' >> $GITHUB_STEP_SUMMARY
          echo '|---------|----------|-----|-----|----------------|--------|' >> $GITHUB_STEP_SUMMARY
          tail -n +2 results-go-arm-a.csv | awk -F',' '{
            split($1, a, "-")
            printf "| %s | %s | %s | %s | %s | %s |\n", $4, $2, $6, $7, $11, $12
          }' >> $GITHUB_STEP_SUMMARY
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: exp02-arm-a
          path: results-go-arm-a.csv
      - name: Stop app
        if: always()
        run: docker compose --profile go-queue down
